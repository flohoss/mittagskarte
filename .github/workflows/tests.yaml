name: Tests

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-backend:
    name: Backend Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Run Go tests with coverage
        run: |
          docker compose run --rm test-backend sh -c '
            go generate ./pkg/snapotter
            ./coverage/coverage.sh coverage.out
          '

      - name: Show coverage summary
        working-directory: backend
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage badge
        working-directory: backend
        run: sh coverage/coverage-badge.sh coverage.out coverage/coverage.svg

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            backend/coverage.out
            backend/coverage.txt
            backend/coverage.html
            backend/coverage/coverage.svg

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run frontend tests
        run: |
          docker compose --profile dev run --rm --entrypoint sh npm -c 'npm ci && npm test'
